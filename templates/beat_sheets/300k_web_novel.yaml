name: "300k网文"
target_words: 300000
target_chapters: 150
words_per_chapter: 2000
platform: "起点/番茄中短篇/晋江完结"

description: |
  适合中短篇男频/女频、完整商业线、轻玄幻、都市异能。
  四卷结构，每卷有独立目标，主线清晰，支线有限。

volumes:
  volume_1:
    name: "起势卷"
    chapters: "1-60"
    word_budget: 120000
    goal: "建立核心爽点，完成第一阶段逆袭"
    requirements:
      - "第1-10章：强势开篇，核心矛盾清晰"
      - "第20章：第一个中等爽点"
      - "第40章：第一个大爽点"
      - "第55-60章：卷尾悬念，引向卷二"
  volume_2:
    name: "扩张卷"
    chapters: "61-120"
    word_budget: 90000
    goal: "敌人升级，主角实力跃迁，舞台扩大"
    requirements:
      - "第70章：新威胁/更强敌人"
      - "第90章：卷二大爽点"
      - "第100章：重大信息揭露"
      - "第115-120章：卷二结尾大钩子"
  volume_3:
    name: "真相卷"
    chapters: "121-130"
    word_budget: 60000
    goal: "主线真相开始揭露，最大危机"
    requirements:
      - "第125章：核心真相揭露"
      - "第128章：主角最大危机（低谷）"
  volume_4:
    name: "终局卷"
    chapters: "131-150"
    word_budget: 30000
    goal: "终局，回收所有伏笔，情感收束"
    requirements:
      - "第135章：最终对决开始"
      - "第145章：所有承诺回收"
      - "第150章：完满结局"

key_beats:
  - chapter: 1
    type: "opening_hook"
  - chapter: 20
    type: "first_medium_payoff"
  - chapter: 40
    type: "first_major_payoff"
  - chapter: 60
    type: "volume_1_end_hook"
  - chapter: 90
    type: "volume_2_major_payoff"
  - chapter: 100
    type: "truth_revelation_begin"
  - chapter: 125
    type: "core_truth_revealed"
  - chapter: 128
    type: "protagonist_darkest_moment"
  - chapter: 135
    type: "final_battle_begin"
  - chapter: 150
    type: "resolution"

pacing_rules:
  small_payoff_every: 3
  medium_payoff_every: 10
  major_payoff_every: 30
  volume_end_hook: true
  max_filler_in_a_row: 2
