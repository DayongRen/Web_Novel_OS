template_id: face_slapping_scene
display_name: "打脸场景范本"
applicable_genres: ["urban_rebirth", "xuanhuan_upgrade", "palace_intrigue", "short_drama_revenge"]

description: |
  打脸场景是爽文最核心的爽点单元。
  好的打脸场景：铺垫充分 → 读者期待 → 先绝望 → 反转 → 震惊升级 → 爽感最大化。

structure:
  phase_1:
    name: "对立建立"
    beats:
      - "反角的傲慢态度清晰展示"
      - "反角对主角的轻视有具体行动（不只是表情）"
      - "旁观者的反应（强化羞辱感）"
      - "读者愤怒感积累"
  phase_2:
    name: "压力顶峰"
    beats:
      - "反角达到气焰最盛的时刻"
      - "主角似乎毫无反击余地"
      - "旁观者开始同情/嘲笑主角"
      - "读者情绪：既愤怒又期待"
  phase_3:
    name: "转折引爆"
    beats:
      - "主角的反击以意想不到的方式开始"
      - "反角的反应：第一波震惊（读者第一层爽感）"
      - "旁观者开始转变立场"
  phase_4:
    name: "打脸完成"
    beats:
      - "主角的优势完全展示"
      - "反角的彻底失败/尴尬/狼狈"
      - "旁观者的震惊反应（强化爽感）"
      - "最后一击（可以是语言也可以是行动）"
  phase_5:
    name: "余震设计"
    beats:
      - "打脸的影响扩散（更多人知道）"
      - "反角的后续反应（愤怒?复仇决心?）"
      - "为下一次更大打脸埋下伏笔"

escalation_rules:
  - "每次打脸都要比上一次更爽，不能平级重复"
  - "打脸的方式要有变化（经济打脸/身份打脸/能力打脸/公开打脸）"
  - "反角每次被打脸后要有新的动作，不能只是摔门而去"
  - "最终的大打脸要有前几次的铺垫价值"

avoid:
  - "打脸太快（铺垫不足，爽感打折）"
  - "打脸太慢（铺垫过长，读者不耐烦）"
  - "反角完全消失没有反应"
  - "旁观者只是摆设"
  - "打脸方式太残忍（影响主角形象）"
  - "同一种方式重复打脸"

pacing:
  setup_beats: 3
  pressure_beats: 2
  reversal_beat: 1
  payoff_beats: 2
  aftershock_beat: 1
  total_ideal_length: "1500-3000字"
