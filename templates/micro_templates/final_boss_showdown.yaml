template_id: final_boss_showdown
display_name: "最终Boss决战场景范本"
applicable_genres: ["all"]

description: |
  最终决战是全书最重要的场景，必须完成：
  情感账单的最终结算 + 能力巅峰展示 + 主题升华。

pre_conditions:
  - "读者对主角有强烈的情感投资（前面的铺垫做到位）"
  - "Boss的威胁是真实的（不只是口头威胁）"
  - "这场战斗的结果对读者有真实的情感意义"
  - "主角有明确的获胜理由（不只是勇气或运气）"

structure:
  phase_1:
    name: "决战前"
    beats:
      - "双方最后一次正面确认立场/动机"
      - "决战地点/条件的戏剧性建立"
      - "主角的内心准备（回想最重要的一条誓言或情感）"
  phase_2:
    name: "初期形势逆转"
    beats:
      - "Boss展示真实强大（主角初期处于劣势）"
      - "主角的主要策略/能力被压制"
      - "危机升至最高点"
  phase_3:
    name: "转折触发"
    beats:
      - "主角的真正资本显现（必须是前文铺垫过的）"
      - "转折不能靠运气，要靠：准备/智慧/牺牲/伏笔回收"
      - "Boss第一次真正处于威胁中"
  phase_4:
    name: "决定性打击"
    beats:
      - "主角完成最强攻击（与成长弧有关）"
      - "Boss的失败要有尊严（让胜利更有重量）"
      - "胜利的瞬间要有情感分量（不只是战斗胜利）"
  phase_5:
    name: "结算与余韵"
    beats:
      - "胜利后的情感时刻（不要立刻跳到下一件事）"
      - "主要承诺和期待的完成确认"
      - "结局的情感基调建立"

requirements:
  - "决战的胜利方式必须是前文铺垫过的（不能空降新能力）"
  - "Boss的失败逻辑必须自洽"
  - "主角必须付出代价（没有代价的胜利不够爽）"
  - "决战要与主角的个人成长弧挂钩"

avoid:
  - "Boss突然变弱"
  - "主角靠运气获胜"
  - "决战太短（对不起铺垫）"
  - "决战太长（节奏疲劳）"
  - "决战后立刻跳向结局，不给读者情绪落点"
  - "最后关头突然出现新能力"

length_guide:
  minimum: "5000字"
  ideal: "8000-15000字"
  maximum: "20000字（超过需拆成多章）"
