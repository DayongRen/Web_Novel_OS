template_id: betrayal_reveal_scene
display_name: "背叛揭露场景范本"
applicable_genres: ["all"]

description: |
  背叛揭露是网文最强力的情绪爆炸点之一。
  需要铺垫、震惊、愤怒、行动的完整链条。

structure:
  phase_1:
    name: "铺垫（可以在多章前）"
    beats:
      - "细节暗示：背叛者行为出现轻微异常"
      - "主角信任背叛者的具体表现（让读者感受到背叛的份量）"
      - "背叛者的内心/压力（让背叛有人性逻辑）"
  phase_2:
    name: "发现时刻"
    beats:
      - "主角意外获得证据或亲眼目睹"
      - "第一反应：不相信/震惊/拒绝承认"
      - "证据无法抵赖的确认时刻"
  phase_3:
    name: "情绪爆发"
    beats:
      - "主角内心的崩塌（不用太长，但要真实）"
      - "背叛者被当面质问（可选，但很爽）"
      - "背叛者的解释（合理但无法原谅）"
  phase_4:
    name: "转折与决断"
    beats:
      - "主角从崩溃中重建（或冷静下来）"
      - "主角做出明确决定（复仇/离开/隐忍）"
      - "这个决定改变了故事方向"
  phase_5:
    name: "余震"
    beats:
      - "背叛的影响扩散"
      - "新的复仇或逆袭目标确立"

requirements:
  - "背叛必须有可信的动机（不能只是'因为他坏'）"
  - "背叛者必须是读者已经认识的角色（才有冲击感）"
  - "背叛的程度要与主角的信任程度匹配"
  - "主角的反应要符合人性（震惊→否认→愤怒→决断）"
  - "不要让主角太快原谅"

avoid:
  - "背叛者是新出现的角色"
  - "背叛动机太弱（读者不信）"
  - "主角立刻冷静并做出完美反应"
  - "背叛后主角很快原谅"
  - "背叛只是为了制造冲突，没有后续影响"
