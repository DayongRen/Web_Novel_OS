template_id: confession_scene
display_name: "表白/感情确认场景范本"
applicable_genres: ["romance_ceo", "school_youth", "urban_rebirth", "xianxia_sect"]

structure:
  phase_1:
    name: "情绪临界"
    beats:
      - "一个触发事件让感情无法继续压制"
      - "双方都感受到但谁也没说破"
      - "外部压力（时间/危险/分离）"
  phase_2:
    name: "表白时刻"
    beats:
      - "表白者鼓起勇气的内心过程（简短但真实）"
      - "表白的方式（语言/行动/两者都有）"
      - "被表白者的第一反应（震惊/感动/怀疑）"
  phase_3:
    name: "回应与确认"
    beats:
      - "回应的过程（不能太快）"
      - "确认时刻的情感质感"
      - "关系升级后两人的状态变化"

requirements:
  - "表白前必须有足够的情绪铺垫（至少8章的积累）"
  - "表白方式要符合人物性格"
  - "回应不能太完美（要有真实感）"
  - "确认后关系要有实质变化，不能回到原点"

avoid:
  - "毫无铺垫的突然表白"
  - "表白立刻被接受没有任何过程"
  - "表白后关系没有变化"
  - "表白时使用过于肉麻的台词"
