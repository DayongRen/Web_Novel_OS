template_id: dungeon_instance_scene
display_name: "副本/关卡场景范本"
applicable_genres: ["infinite_flow", "xuanhuan_upgrade", "sci_fi_mecha"]

structure:
  phase_1:
    name: "入场建立"
    beats:
      - "副本/关卡的明确规则说明"
      - "死亡威胁的真实建立"
      - "队伍状态（资源/伤势/矛盾）"
  phase_2:
    name: "探索与试错"
    beats:
      - "初步规则验证（付出一定代价）"
      - "发现第一条隐藏信息"
      - "压力升级（时间/资源/队员危机）"
  phase_3:
    name: "关键推理或突破"
    beats:
      - "主角发现核心规律/弱点"
      - "执行计划（不能一次成功，要有波折）"
      - "最后关头的危机"
  phase_4:
    name: "通关与收获"
    beats:
      - "通关的决定性时刻"
      - "奖励或信息揭露"
      - "对更大谜团的暗示"

instance_design_rules:
  - "规则必须在揭露答案前对读者展示"
  - "隐藏规则的发现要有逻辑依据"
  - "每个副本要给读者新的信息"
  - "死亡威胁不能是假的（至少有真实危险）"

avoid:
  - "主角没有任何准备就过关"
  - "规则被随意修改"
  - "每次都用同样方式过关"
  - "副本与主线完全无关"
